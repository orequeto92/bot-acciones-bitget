name: Bot Acciones Bitget (servicio de sesion + Telegram)

# UN disparo que se queda vivo toda la sesion, en vez de 78 que quiza no ocurran.
#
# POR QUE. La version anterior usaba cron cada 5 minutos. Medido en la primera
# sesion real (3-ago-2026): de ~42 ejecuciones esperadas desde la apertura,
# GitHub lanzo UNA. Los cron de Actions se retrasan y se descartan bajo carga,
# y en repos publicos pasa constantemente. El efecto no era solo perder señales:
# el SEGUIMIENTO tampoco corria, asi que nadie avisaba de TP1 (ni de mover el SL
# a break-even) ni del cierre de sesion.
#
# Ahora tools/servicio.py hace el ciclo cada 5 min DENTRO de un solo job. Un job
# aguanta hasta 6 horas y la sesion dura 6.5, asi que van dos tandas:
#   · 13:20 UTC -> cubre desde antes de la apertura (13:30 UTC = 9:30 ET)
#   · 19:00 UTC -> cubre el tramo final y el cierre (20:00 UTC = 16:00 ET)
# El horario va en UTC y no entiende de horario de verano, asi que se lanza
# ancho y el reloj de tools/sesion.py decide de verdad.
#
# CONFIGURACION (una vez): Settings -> Secrets and variables -> Actions:
#     TELEGRAM_TOKEN    = token de @BotFather
#     TELEGRAM_CHAT_ID  = id de tu chat

on:
  schedule:
    - cron: "20 13 * * 1-5"     # tanda 1: desde antes de la apertura US
    - cron: "0 19 * * 1-5"      # tanda 2: tramo final y cierre
    - cron: "0 7 * * 1-5"       # materias primas: manana europea
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que se queda vivo el servicio"
        required: false
        default: "350"

permissions:
  contents: write

concurrency:
  group: acciones
  cancel-in-progress: false

jobs:
  acciones:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # tope de GitHub para un job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que el canal de Telegram funciona
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/diagnostico.py

      - name: Servicio de sesion (ciclo cada 5 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/servicio.py --intervalo 300 --minutos ${{ github.event.inputs.minutos || 350 }}

      # if:always() para que el estado se guarde aunque el servicio muera por
      # timeout. `git add -A -- datos/` porque `git add` con varias rutas es
      # atomico y fallaba entero si una no existia.
      - name: Guardar estado (posiciones + ajustes)
        if: always()
        run: |
          git config user.name "acciones-bot"
          git config user.email "acciones-bot@users.noreply.github.com"
          git add -A -- datos/
          if git diff --cached --quiet; then
            echo "sin cambios de estado que guardar"
          else
            git commit -m "estado acciones [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
